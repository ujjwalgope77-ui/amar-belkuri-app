{% extends "base.html" %}
{% block content %}
<h2>আপনার কার্ট</h2>
{% if items %}
<div class="scroll"><table>
  <tr><th>পণ্য</th><th>পরিমাণ</th><th>মোট</th><th></th></tr>
  {% for i in items %}
  <tr>
    <td>{{ i.p.name }}</td><td>{{ i.qty }}</td><td>৳{{ "%.0f"|format(i.sub) }}</td>
    <td><form method="post" action="{{ url_for('remove', pid=i.p.id) }}"><button class="red">মুছুন</button></form></td>
  </tr>
  {% endfor %}
</table></div>
<h3>সর্বমোট: ৳{{ "%.0f"|format(total) }}</h3>
<a class="btn" href="{{ url_for('checkout') }}">অর্ডার করুন</a>
{% else %}
<p>কার্ট খালি।</p><a class="btn" href="{{ url_for('index') }}">কেনাকাটা করুন</a>
{% endif %}
{% endblock %}
