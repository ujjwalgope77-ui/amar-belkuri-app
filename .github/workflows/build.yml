name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check required files
        run: |
          ls -la
          test -f main.py || (echo "main.py missing" && exit 1)
          test -f ab.png || (echo "ab.png missing in root folder" && exit 1)

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zip unzip \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev libltdl-dev uuid-dev
          pip install --upgrade pip setuptools
          pip install buildozer "cython==0.29.36" virtualenv

      - name: Build APK
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: amar-belkuri-apk
          path: bin/*.apk
          if-no-files-found: error
