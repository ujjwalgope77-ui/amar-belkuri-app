{% extends "base.html" %}
{% block content %}
<h2>পণ্যসমূহ</h2>
<div class="grid">
  {% for p in products %}
  <div class="card">
    {% if p.image %}<img src="{{ p.image }}" alt="">{% else %}<img alt="">{% endif %}
    <h4>{{ p.name }}</h4>
    <small>{{ p.description }}</small>
    <p class="price">৳{{ "%.0f"|format(p.price) }}</p>
    <form method="post" action="{{ url_for('add_to_cart', pid=p.id) }}">
      <button>কার্টে যোগ করুন</button>
    </form>
  </div>
  {% else %}<p>কোনো পণ্য নেই।</p>{% endfor %}
</div>
{% endblock %}
