{% extends "base.html" %}
{% block content %}
<h2>অর্ডার সম্পন্ন করুন</h2>
<p>সর্বমোট: <b>৳{{ "%.0f"|format(total) }}</b> (ক্যাশ অন ডেলিভারি)</p>
<form method="post">
  <label>নাম</label><input name="name" required>
  <label>ফোন নম্বর</label><input name="phone" required>
  <label>ঠিকানা</label><textarea name="address" rows="3" required></textarea>
  <button>অর্ডার নিশ্চিত করুন</button>
</form>
{% endblock %}
