<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আমার বেলকুড়ি</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a href="{{ url_for('index') }}" style="margin:0;font-size:18px">আমার বেলকুড়ি</a>
  <span>
    <a href="{{ url_for('cart') }}">🛒 কার্ট ({{ cart_count }})</a>
    <a href="{{ url_for('admin') }}">অ্যাডমিন</a>
  </span>
</header>
<main>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
